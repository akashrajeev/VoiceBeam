name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/models
            app/src/androidTest/assets
          key: models-${{ hashFiles('scripts/fetch_models.sh') }}
      - name: Fetch on-device models
        run: bash scripts/fetch_models.sh
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: voicebeam-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/models
            app/src/androidTest/assets
          key: models-${{ hashFiles('scripts/fetch_models.sh') }}
      - name: Fetch on-device models
        run: bash scripts/fetch_models.sh
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
