name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/models
            app/src/androidTest/assets
          key: models-${{ hashFiles('scripts/fetch_models.sh') }}
      - name: Fetch on-device models
        run: mkdir -p ci && bash scripts/fetch_models.sh 2>&1 | tail -40 > ci/fetch.log
      - name: Unit tests
        run: set -o pipefail; ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ci/unit.log
      - name: Build APKs
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee ci/build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p ci/apk ci/unit-results
          cp app/build/outputs/apk/release/*.apk ci/apk/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk ci/apk/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml ci/unit-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: ci/

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/assets/models
            app/src/androidTest/assets
          key: models-${{ hashFiles('scripts/fetch_models.sh') }}
      - name: Fetch on-device models
        run: bash scripts/fetch_models.sh > /dev/null 2>&1
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          script: mkdir -p ci && (./gradlew --no-daemon connectedDebugAndroidTest > ci/device.log 2>&1; echo $? > ci/device.exit; adb logcat -d -s VoiceBeamTest VoiceBeamEngine VoiceBeamModels VoiceBeamAudio VoiceBeamUI VoiceBeamVision AndroidRuntime > ci/logcat.txt; exit $(cat ci/device.exit))
      - name: Collect
        if: always()
        run: |
          mkdir -p ci/device-results
          cp -r app/build/outputs/androidTest-results/connected/* ci/device-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-out
          path: ci/

  publish:
    # Pushes APKs, logs and test results to the ci-results branch so they can be pulled with git.
    needs: [build, device-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push results
        run: |
          cd out
          cat > STATUS.txt <<EOT
          commit=${{ github.sha }}
          run=${{ github.run_id }}
          build=${{ needs.build.result }}
          device_tests=${{ needs.device-tests.result }}
          EOT
          find . -name '*.log' -size +3M -exec sh -c 'tail -c 3000000 "$1" > "$1.t" && mv "$1.t" "$1"' _ {} \;
          git init -q -b ci-results
          git config user.name "AKASH RAJEEV K V"
          git config user.email "68802546+akashrajeev@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results
